# SonarQube Project Properties — BookNest Book Service
sonar.projectKey=booknest-book-service
sonar.projectName=BookNest Book Service
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo coverage report (generated by: mvn test)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# SonarQube server — update token after login to http://localhost:9000
sonar.host.url=http://localhost:9000
sonar.token=YOUR_SONAR_TOKEN_HERE

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (skip boilerplate config classes)
sonar.exclusions=**/config/**,**/*Application.java,**/dto/**,**/exception/**
sonar.coverage.exclusions=**/config/**,**/*Application.java,**/dto/**,**/exception/**
