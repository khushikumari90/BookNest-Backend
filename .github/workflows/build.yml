          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=khushikumari90_BookNest-Backend \
            -Dsonar.organization=khushikumari90 \
            -Dsonar.host.url=https://sonarcloud.io \
            -DskipTests=true || true

      - name: Build and analyze - wishlist-service
        working-directory: wishlist-service
